name: Make episode

on:
  # schedule is OFF until the engine is finished and the test episode is approved
  # schedule:
  #   - cron: '0 6 * * *'       # daily 06:00 UTC; run.py makes an episode only every ~2 days (min 40 h gap)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, do not upload'
        type: boolean
        default: true
      topic:
        description: 'Optional topic override'
        required: false

permissions:
  contents: write
concurrency: episode
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm', cache-dependency-path: render/package-lock.json}
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Render deps
        run: cd render && npm ci && npx remotion browser ensure
      - name: Cache models
        uses: actions/cache@v4
        with: {path: work/tts_model, key: kokoro-v1}
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ inputs.topic }}\""; fi
          eval python -m agent.run $ARGS
      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: |
            work/*/final_*.mp4
            work/*/thumbnail*.jpg
            work/*/package.json
            work/*/episode.json
            work/*/qa/*.jpg
            work/*/research.md
            work/raw_fail_*.txt
            work/cost.json
            work/*/assets/cast_*.png
            work/*/style_*.json
          retention-days: 14
      - name: Commit topic/history updates
        if: success()
        run: |
          git config user.name "iyb-agent"; git config user.email "agent@users.noreply.github.com"
          git add data/ && git commit -m "episode: update topics/history [skip ci]" && git push || echo "nothing to commit"
