name: eleven_test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ElevenLabs connection test
        env:
          KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          V=PEdcOLzbXYhL8IKOswXB
          mkdir out
          curl -s -H "xi-api-key: $KEY" https://api.elevenlabs.io/v1/user/subscription | python3 -c "import json,sys;d=json.load(sys.stdin);print('tier',d.get('tier'),'used',d.get('character_count'),'limit',d.get('character_limit'), d.get('detail',''))" || true
          for M in eleven_v3 eleven_multilingual_v2; do
            code=$(curl -s -o out/$M.mp3 -w "%{http_code}" -X POST "https://api.elevenlabs.io/v1/text-to-speech/$V?output_format=mp3_44100_128" \
              -H "xi-api-key: $KEY" -H "Content-Type: application/json" \
              -d "{\"text\": \"سلام! این یک آزمایش کوتاه است. اگر فقط یک وعده در روز غذا بخوری، بدنت ساعت به ساعت چه تغییری می‌کند؟\", \"model_id\": \"$M\"}")
            echo "$M -> HTTP $code, $(stat -c%s out/$M.mp3) bytes"; [ "$code" = 200 ] || head -c 400 out/$M.mp3
          done
      - uses: actions/upload-artifact@v4
        with: {name: eleven-test, path: out/, retention-days: 3}
